global:
  scrape_interval: 15s

scrape_configs:
  - job_name: transcode-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api_server:8080"]

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
